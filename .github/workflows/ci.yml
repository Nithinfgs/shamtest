name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run unit and integration tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Self-test with shamtest
        run: |
          shamtest tests/

      - name: Verify bad test detection on demo suite
        run: |
          # Ensure demo_bad_tests.py is correctly flagged with exit code 1
          if shamtest examples/demo_bad_tests.py; then
            echo "Expected demo_bad_tests.py to fail, but it passed!"
            exit 1
          else
            echo "demo_bad_tests.py successfully flagged as expected."
          fi

      - name: Export SARIF report
        if: matrix.python-version == '3.12'
        run: |
          shamtest examples/demo_bad_tests.py --sarif --fail-on never > shamtest-results.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: matrix.python-version == '3.12' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: shamtest-results.sarif
